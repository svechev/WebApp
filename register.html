<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Регистрация</h1>
        <form class="form" id="reg-form">
            <div class="field">
                <label for="email">Имейл*</label>
                <input id="email" name="email" type="email" required/>
                <div id="email-error" class="error"></div>
            </div>
            
            <div class="field">
                <label for="username">Потребителско име*</label>
                <input id="username" name="username" type="text" minlength="3" maxlength="32" required/>
                <div class="hint">Поне 3 символа, не повече от 32</div>
                <div id="username-error" class="error"></div>
            </div>

            <div class="field">
                <label for="password">Парола*</label>
                <input id="password" name="password" type="password" minlength="8" required/>
                <div class="hint">Поне 8 символа и да включва малка и главна букви, и цифри</div>
                <div id="password-error" class="error"></div>
            </div>

            <div class="field">
                <button id="captcha-generator" type="button">Генерирай въпрос</button>
                <label for="captcha">Колко е <span id="captcha-question"></span>?*</label><input id="captcha" name="captcha" type="number" required/>
                <div id="captcha-error" class="error"></div>
            </div>
            
            <button id="register-btn">Регистрация</button>
        
            <div class="error" id="register-error"></div>
            <div id="success"></div>
        </form>

        <script src="/helpers/validation.js" defer></script>
        <script src="register_script.js" async defer></script>
    </body>
</html>
